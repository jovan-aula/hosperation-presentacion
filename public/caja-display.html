<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caja Asertiva en vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #F7FAFC; width: 100vw; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
    #display::-webkit-scrollbar { width: 4px; }
    #display::-webkit-scrollbar-track { background: transparent; }
    #display::-webkit-scrollbar-thumb { background: rgba(12,45,78,0.15); border-radius: 4px; }
    .header { position: fixed; top: 0; left: 0; right: 0; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; background: white; border-bottom: 1px solid rgba(12,45,78,0.08); z-index: 100; }
    .header-title { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: #0C2D4E; font-weight: 400; }
    .controls { display: flex; gap: 10px; align-items: center; }
    .count { font-size: 0.75rem; color: #718096; }
    .btn-limpiar { background: rgba(12,45,78,0.05); border: 1px solid rgba(12,45,78,0.12); color: #4A5568; border-radius: 100px; padding: 6px 16px; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 600; cursor: pointer; letter-spacing: 0.05em; text-transform: uppercase; }
    .btn-nav { background: #0C2D4E; border: none; color: white; border-radius: 100px; padding: 6px 18px; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 700; cursor: pointer; letter-spacing: 0.05em; text-transform: uppercase; }
    .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

    #display { position: absolute; inset: 64px 0 60px 0; overflow-y: auto; padding: 20px 40px 24px; display: flex; align-items: flex-start; justify-content: center; }

    .caja-card {
      background: white;
      border-radius: 20px;
      border: 1px solid rgba(12,45,78,0.08);
      box-shadow: 0 4px 24px rgba(12,45,78,0.08);
      max-width: 860px;
      width: 100%;
      animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }
    @keyframes slideIn { to { opacity:1; transform:translateY(0); } from { opacity:0; transform:translateY(20px); } }

    .card-header { padding: 16px 24px; background: linear-gradient(135deg, #081e35 0%, #0C2D4E 100%); display: flex; align-items: center; gap: 14px; }
    .card-emoji { font-size: 2.2rem; line-height: 1; }
    .card-nombre { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: white; font-weight: 400; }
    .situacion-bar { padding: 10px 24px; background: rgba(12,45,78,0.04); border-bottom: 1px solid rgba(12,45,78,0.06); display: flex; gap: 10px; align-items: flex-start; }
    .situacion-label { font-size: 0.58rem; font-weight: 700; color: #45C5BE; letter-spacing: 0.1em; text-transform: uppercase; flex-shrink: 0; margin-top: 2px; }
    .situacion-text { font-size: 0.85rem; color: #4A5568; line-height: 1.5; }
    .cajas-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .caja { padding: 14px 20px; display: flex; flex-direction: column; gap: 6px; }
    .caja:nth-child(1) { border-right: 1px solid rgba(12,45,78,0.06); border-bottom: 1px solid rgba(12,45,78,0.06); }
    .caja:nth-child(2) { border-bottom: 1px solid rgba(12,45,78,0.06); }
    .caja:nth-child(3) { border-right: 1px solid rgba(12,45,78,0.06); }
    .caja-header { display: flex; align-items: center; gap: 8px; }
    .caja-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; color: white; flex-shrink: 0; }
    .caja-title { font-size: 0.78rem; font-weight: 700; }
    .caja-text { font-size: 0.82rem; color: #4A5568; line-height: 1.55; padding-left: 30px; }

    #waiting { position: absolute; inset: 64px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    #waiting p { font-size: 0.85rem; color: #A0AEC0; font-weight: 300; letter-spacing: 0.06em; text-transform: uppercase; }
    .pulse { width: 12px; height: 12px; border-radius: 50%; background: #45C5BE; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }

    .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 32px; display: flex; align-items: center; justify-content: center; gap: 12px; background: white; border-top: 1px solid rgba(12,45,78,0.08); }
    .footer-text { font-size: 0.7rem; color: #A0AEC0; letter-spacing: 0.06em; text-transform: uppercase; }
    .footer-url { font-size: 0.7rem; color: #45C5BE; font-weight: 700; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">La Caja Asertiva — por equipos</div>
    <div class="controls">
      <span class="count" id="count">0 equipos</span>
      <button class="btn-nav" id="btnPrev" onclick="navPrev()" disabled>&#8592;</button>
      <button class="btn-nav" id="btnNext" onclick="navNext()" disabled>&#8594;</button>
      <button class="btn-limpiar" onclick="limpiar()">Limpiar</button>
    </div>
  </div>

  <div id="waiting"><div class="pulse"></div><p>Esperando equipos...</p></div>
  <div id="display"></div>

  <div class="footer">
    <span class="footer-text">Escanea y llena tu caja</span>
    <span class="footer-url">hosperation-presentacion.vercel.app/caja-input.html</span>
  </div>

<script>
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSkf9bUF95VsUK-asDP2z5LhDLlMHGxdMM48ebxxle2IjhZDyiUjY06yXlrOoyc-s/exec";
  var equipos = [];
  var currentIdx = 0;

  var coloresCaja = [
    { bg: '#0C2D4E', color: '#0C2D4E' },
    { bg: '#2BA8A2', color: '#2BA8A2' },
    { bg: '#d97706', color: '#d97706' },
    { bg: '#7c3aed', color: '#7c3aed' },
  ];
  var titulos = ['Lo que observo', 'Lo que entiendo', 'Lo que puedo hacer', 'Lo que comunico'];

  function limpiar() {
    equipos = []; currentIdx = 0;
    document.getElementById('display').innerHTML = '';
    document.getElementById('count').textContent = '0 equipos';
    updateNav();
    var w = document.createElement('div'); w.id = 'waiting';
    w.innerHTML = '<div class="pulse"></div><p>Esperando equipos...</p>';
    document.body.appendChild(w);
  }

  function renderCard(item) {
    var emojiMatch = item.equipo.match(/^(\S+)\s+(.*)/);
    var emoji = emojiMatch ? emojiMatch[1] : '🏥';
    var nombre = emojiMatch ? emojiMatch[2] : item.equipo;
    var campos = [item.observo, item.entiendo, item.puedo, item.comunico];

    var card = document.createElement('div');
    card.className = 'caja-card';
    card.innerHTML =
      '<div class="card-header">' +
        '<div class="card-emoji">' + emoji + '</div>' +
        '<div class="card-nombre">' + nombre + '</div>' +
      '</div>' +
      '<div class="situacion-bar">' +
        '<span class="situacion-label">Situación</span>' +
        '<span class="situacion-text">' + item.situacion + '</span>' +
      '</div>' +
      '<div class="cajas-grid">' +
        campos.map(function(campo, i) {
          return '<div class="caja">' +
            '<div class="caja-header">' +
              '<div class="caja-num" style="background:' + coloresCaja[i].bg + '">' + (i+1) + '</div>' +
              '<div class="caja-title" style="color:' + coloresCaja[i].color + '">' + titulos[i] + '</div>' +
            '</div>' +
            '<div class="caja-text">' + campo + '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    return card;
  }

  function showCurrent() {
    var display = document.getElementById('display');
    display.innerHTML = '';
    if (equipos.length === 0) return;
    display.appendChild(renderCard(equipos[currentIdx]));
    document.getElementById('count').textContent = (currentIdx + 1) + ' / ' + equipos.length + ' equipo' + (equipos.length > 1 ? 's' : '');
    updateNav();
  }

  function navPrev() { if (currentIdx > 0) { currentIdx--; showCurrent(); } }
  function navNext() { if (currentIdx < equipos.length - 1) { currentIdx++; showCurrent(); } }

  function updateNav() {
    document.getElementById('btnPrev').disabled = currentIdx === 0 || equipos.length === 0;
    document.getElementById('btnNext').disabled = currentIdx >= equipos.length - 1 || equipos.length === 0;
  }

  function fetchData() {
    fetch(SCRIPT_URL + '?tipo=caja')
      .then(function(r) { return r.json(); })
      .then(function(items) {
        if (items.length > equipos.length) {
          var waiting = document.getElementById('waiting');
          if (waiting) waiting.remove();
          equipos = items;
          showCurrent();
        }
      })
      .catch(function() {});
  }

  fetchData();
  setInterval(fetchData, 2000);
</script>
</body>
</html>
