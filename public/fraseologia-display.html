<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraseología en vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #F7FAFC;
      width: 100vw; height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-bottom: 1px solid rgba(12,45,78,0.08);
      z-index: 100;
    }
    .header-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      color: #0C2D4E;
      font-weight: 400;
    }
    .controls { display: flex; gap: 10px; align-items: center; }
    .count { font-size: 0.75rem; color: #718096; font-weight: 300; }
    .btn-limpiar {
      background: rgba(12,45,78,0.05);
      border: 1px solid rgba(12,45,78,0.12);
      color: #4A5568;
      border-radius: 100px;
      padding: 6px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn-limpiar:hover { background: rgba(12,45,78,0.1); }

    #grid {
      position: absolute;
      inset: 72px 32px 80px 32px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      align-content: start;
      overflow-y: auto;
      padding: 8px 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(12,45,78,0.08);
      box-shadow: 0 2px 12px rgba(12,45,78,0.06);
      overflow: hidden;
      animation: slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }
    @keyframes slideIn {
      to { opacity: 1; transform: translateY(0); }
      from { opacity: 0; transform: translateY(20px); }
    }
    .card-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, #081e35 0%, #0C2D4E 100%);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .area-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      color: white;
      font-weight: 400;
    }
    .card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .frase-row { display: flex; flex-direction: column; gap: 4px; }
    .frase-label {
      font-size: 0.58rem;
      font-weight: 700;
      color: #45C5BE;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .frase-text {
      font-size: 0.85rem;
      color: #4A5568;
      line-height: 1.55;
      font-style: italic;
    }
    .frase-divider {
      height: 1px;
      background: rgba(12,45,78,0.06);
    }

    #waiting {
      position: absolute;
      inset: 72px 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #waiting p { font-size: 0.85rem; color: #A0AEC0; font-weight: 300; letter-spacing: 0.06em; text-transform: uppercase; }
    .pulse { width: 12px; height: 12px; border-radius: 50%; background: #45C5BE; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: white;
      border-top: 1px solid rgba(12,45,78,0.08);
    }
    .footer-text { font-size: 0.7rem; color: #A0AEC0; letter-spacing: 0.06em; text-transform: uppercase; }
    .footer-url { font-size: 0.7rem; color: #45C5BE; font-weight: 700; letter-spacing: 0.04em; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">Fraseología por equipos</div>
    <div class="controls">
      <span class="count" id="count">0 equipos</span>
      <button class="btn-limpiar" onclick="limpiar()">Limpiar</button>
    </div>
  </div>

  <div id="waiting">
    <div class="pulse"></div>
    <p>Esperando equipos...</p>
  </div>

  <div id="grid"></div>

  <div class="footer">
    <span class="footer-text">Escanea y agrega tu equipo</span>
    <span class="footer-url">hosperation-presentacion.vercel.app/fraseologia-input.html</span>
  </div>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSkf9bUF95VsUK-asDP2z5LhDLlMHGxdMM48ebxxle2IjhZDyiUjY06yXlrOoyc-s/exec";

    var mostrados = {};

    function limpiar() {
      mostrados = {};
      document.getElementById("grid").innerHTML = "";
      document.getElementById("count").textContent = "0 equipos";
      var waiting = document.createElement("div");
      waiting.id = "waiting";
      waiting.innerHTML = '<div class="pulse"></div><p>Esperando equipos...</p>';
      document.body.appendChild(waiting);
    }

    function agregarCard(item) {
      var key = item.area.toLowerCase().trim();
      if (mostrados[key]) return;
      mostrados[key] = true;

      var waiting = document.getElementById("waiting");
      if (waiting) waiting.remove();

      var grid = document.getElementById("grid");
      var partes = item.area.split(' — ');
      var equipoRaw = partes[0] || item.area;
      var areaNombre = partes[1] || '';
      var emojiMatch = equipoRaw.match(/^(\S+)\s+(.*)/);
      var emoji = emojiMatch ? emojiMatch[1] : '🏥';
      var nombre = emojiMatch ? emojiMatch[2] : equipoRaw;

      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="card-header">' +
          '<div style="font-size:2rem;line-height:1;flex-shrink:0">' + emoji + '</div>' +
          '<div>' +
            '<div class="area-name">' + nombre + '</div>' +
            '<div style="font-size:0.65rem;color:#45C5BE;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-top:2px">' + areaNombre + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="frase-row">' +
            '<div class="frase-label">Bienvenida</div>' +
            '<div class="frase-text">"' + item.bienvenida + '"</div>' +
          '</div>' +
          '<div class="frase-divider"></div>' +
          '<div class="frase-row">' +
            '<div class="frase-label">Despedida</div>' +
            '<div class="frase-text">"' + item.despedida + '"</div>' +
          '</div>' +
          '<div class="frase-divider"></div>' +
          '<div class="frase-row">' +
            '<div class="frase-label">Telefono</div>' +
            '<div class="frase-text">"' + item.telefono + '"</div>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);

      var total = Object.keys(mostrados).length;
      document.getElementById("count").textContent = total + (total === 1 ? " equipo" : " equipos");
    }

    function fetchData() {
      fetch(SCRIPT_URL + "?tipo=fraseologia")
        .then(function(r) { return r.json(); })
        .then(function(items) {
          items.forEach(function(item) { agregarCard(item); });
        })
        .catch(function() {});
    }

    fetchData();
    setInterval(fetchData, 2000);
  </script>

</body>
</html>
