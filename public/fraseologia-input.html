<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraseologia del equipo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(160deg, #081e35 0%, #0C2D4E 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 36px 28px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .badge {
      background: rgba(69,197,190,0.15);
      border: 1px solid rgba(69,197,190,0.35);
      border-radius: 100px;
      padding: 5px 16px;
      font-size: 10px;
      font-weight: 700;
      color: #45C5BE;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      width: fit-content;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.4rem, 5vw, 1.8rem);
      color: white;
      line-height: 1.25;
      font-weight: 400;
    }
    .divider {
      width: 40px;
      height: 3px;
      background: #45C5BE;
      border-radius: 2px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #45C5BE;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    input[type="text"], textarea {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 13px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: white;
      outline: none;
      transition: border 0.2s;
      resize: none;
    }
    input[type="text"]::placeholder, textarea::placeholder { color: rgba(255,255,255,0.3); }
    input[type="text"]:focus, textarea:focus { border-color: #45C5BE; }
    textarea { min-height: 80px; line-height: 1.6; }
    button {
      width: 100%;
      padding: 15px;
      background: #45C5BE;
      color: #0C2D4E;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s;
      letter-spacing: 0.03em;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    .check {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(69,197,190,0.15);
      border: 2px solid #45C5BE;
      display: flex; align-items: center; justify-content: center;
    }
    .success h2 { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: white; font-weight: 400; }
    .success p { font-size: 0.85rem; color: rgba(255,255,255,0.45); line-height: 1.6; }
  </style>
</head>
<body>

  <div class="card" id="formCard">
    <div class="badge">Actividad en equipos</div>
    <h1>Fraseologia de su equipo</h1>
    <div class="divider"></div>

    <div class="field">
      <label>Area del equipo</label>
      <input type="text" id="area" placeholder="Ej: Enfermeria, Recepcion, Farmacia..." maxlength="40" autocomplete="off" />
    </div>

    <div class="field">
      <label>Frase de bienvenida</label>
      <textarea id="bienvenida" placeholder="¿Como reciben a un paciente o familiar?" maxlength="200"></textarea>
    </div>

    <div class="field">
      <label>Frase de despedida</label>
      <textarea id="despedida" placeholder="¿Como se despiden al final de la atencion?" maxlength="200"></textarea>
    </div>

    <div class="field">
      <label>Como contestan el telefono</label>
      <textarea id="telefono" placeholder="¿Como responden cuando suena el telefono?" maxlength="200"></textarea>
    </div>

    <button id="btn" onclick="enviar()">Enviar fraseologia del equipo</button>
  </div>

  <div class="card success" id="successCard">
    <div class="check">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#45C5BE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h2>Enviado</h2>
    <p>La fraseologia de su equipo ya aparece en pantalla.</p>
  </div>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSkf9bUF95VsUK-asDP2z5LhDLlMHGxdMM48ebxxle2IjhZDyiUjY06yXlrOoyc-s/exec";

    function enviar() {
      var area = document.getElementById("area").value.trim();
      var bienvenida = document.getElementById("bienvenida").value.trim();
      var despedida = document.getElementById("despedida").value.trim();
      var telefono = document.getElementById("telefono").value.trim();

      if (!area || !bienvenida || !despedida || !telefono) {
        alert("Por favor completa todos los campos.");
        return;
      }

      var btn = document.getElementById("btn");
      btn.disabled = true;
      btn.textContent = "Enviando...";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ tipo: "fraseologia", area: area, bienvenida: bienvenida, despedida: despedida, telefono: telefono })
      }).catch(function() {}).finally(function() {
        document.getElementById("formCard").style.display = "none";
        document.getElementById("successCard").style.display = "flex";
      });
    }
  </script>

</body>
</html>
